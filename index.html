<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ja2-node</title>
    <link rel="stylesheet" href="./src/app/launcher/style.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <h1>ja2-node</h1>
        <p class="tagline" data-label="tagline">A non-commercial reimplementation of Jagged Alliance 2</p>
      </div>
      <a id="playLink" class="play" href="/play" data-label="play">Play</a>
      <div id="dataInfo" class="data-info"></div>
      <label class="language"><span data-label="language">Display language</span> <select id="language"></select></label>
      <a id="devLink" class="dev-link" href="/dev" data-label="developerPages">Developer pages</a>
    </header>
    <main class="launcher">
      <section id="saves" class="panel wide">
        <h2 data-label="savedGames">Saved games</h2>
        <div class="table-box">
          <table id="saveList" class="save-list"></table>
        </div>
        <div class="row actions">
          <button type="button" id="loadSave" data-label="loadSelected" disabled>Load selected</button>
          <button type="button" id="deleteSave" data-label="delete" disabled>Delete</button>
          <button type="button" id="downloadSave" data-label="download" disabled>Download</button>
          <label class="button"><span data-label="upload">Upload</span><input id="uploadSave" type="file" accept=".j2s,.gz" hidden /></label>
        </div>
      </section>

      <section id="settings" class="panel">
        <h2 data-label="settings">Settings</h2>
        <div class="volumes">
          <label><span data-label="effectsVolume">Effects</span> <input type="range" min="0" max="127" data-volume="effects" /></label>
          <label><span data-label="speechVolume">Speech</span> <input type="range" min="0" max="127" data-volume="speech" /></label>
          <label><span data-label="musicVolume">Music</span> <input type="range" min="0" max="127" data-volume="music" /></label>
          <label><span data-label="ambientVolume">Ambient</span> <input type="range" min="0" max="127" data-volume="ambient" /></label>
          <label><span data-label="masterVolume">Master</span> <input type="range" min="0" max="127" data-volume="master" /></label>
        </div>
        <div class="toggles">
          <label><input type="checkbox" data-setting="muted" /> <span data-label="mute">mute</span></label>
          <label><input type="checkbox" data-setting="speech" /> <span data-label="speech">speech</span></label>
          <label><input type="checkbox" data-setting="subtitles" /> <span data-label="subtitles">subtitles</span></label>
          <label><input type="checkbox" data-setting="keyAdvanceSpeech" /> <span data-label="keyAdvanceSpeech">key advance speech</span></label>
          <label><input type="checkbox" data-setting="muteConfirmations" /> <span data-label="muteConfirmations">mute confirmations</span></label>
          <label><input type="checkbox" data-setting="sleepWakeNotification" /> <span data-label="sleepWakeNotification">sleep and wake notification</span></label>
          <label><input type="checkbox" data-setting="playSplash" /> <span data-label="playSplash">play the splash at start</span></label>
          <label><input type="checkbox" data-setting="playIntro" /> <span data-label="playIntro">play the intro of a new campaign</span></label>
          <label><span data-label="playbackSpeed">Playback speed</span> <select id="playbackSpeed"></select></label>
        </div>
        <div class="row actions">
          <button type="button" id="exportSettings" data-label="exportSettings">Export settings</button>
          <label class="button"><span data-label="importSettings">Import settings</span><input id="importSettings" type="file" accept=".json,application/json" hidden /></label>
        </div>
      </section>
    </main>
    <footer id="status" class="status" role="status"></footer>
    <dialog id="messageBox" class="message-box">
      <p id="messageText"></p>
      <div class="actions">
        <button type="button" id="messageYes" value="yes"></button>
        <button type="button" id="messageNo" value="no"></button>
      </div>
    </dialog>
    <script type="module" src="./src/app/launcher/main.ts"></script>
  </body>
</html>
