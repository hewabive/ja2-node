<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Video and credits · ja2-node</title>
    <link rel="stylesheet" href="../map-viewer/style.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <a href="/" class="brand">ja2-node</a>
      <span class="title">video and credits</span>
      <span id="status" class="status">connecting…</span>
    </header>
    <main class="video-page">
      <section>
        <h2>Sequences</h2>
        <div class="actions">
          <button type="button" id="playSplash">splash</button>
          <button type="button" id="playBeginning">beginning</button>
          <span class="group">ending
            <label><input id="miguelAlive" type="checkbox" checked /> Miguel alive</label>
            <label><input id="skyriderAlive" type="checkbox" checked /> Skyrider alive</label>
            <button type="button" id="playEnding">play</button>
          </span>
          <button type="button" id="playCredits">credits</button>
        </div>
        <p class="hint">Escape ends a sequence or the credits, Space or a click ends the current video.</p>
      </section>
      <section>
        <h2>Client settings</h2>
        <div class="actions">
          <label><input id="settingSplash" type="checkbox" /> play the splash (launcher start)</label>
          <label><input id="settingIntro" type="checkbox" /> play the beginning intro (new campaign)</label>
        </div>
      </section>
      <section>
        <h2>Last results</h2>
        <table id="results" class="results"></table>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
