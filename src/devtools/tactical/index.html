<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tactical · ja2-node</title>
    <link rel="stylesheet" href="../map-viewer/style.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <a href="/" class="brand">ja2-node</a>
      <span class="title">tactical sandbox</span>
      <span class="group">time
        <button type="button" data-speed="0">pause</button><button type="button" data-speed="1">1×</button><button type="button" data-speed="2">2×</button><button type="button" data-speed="4">4×</button><button type="button" data-speed="8">8×</button>
      </span>
      <button type="button" id="idle">run until idle</button>
      <label><input id="roofs" type="checkbox" checked /> roofs</label>
      <span class="group">zoom <button type="button" data-zoom="1">1×</button><button type="button" data-zoom="2">2×</button></span>
      <span id="status" class="status">connecting…</span>
    </header>
    <main>
      <canvas id="canvas"></canvas>
      <div id="info" class="info"></div>
      <canvas id="radar" class="radar" width="88" height="44" hidden></canvas>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
