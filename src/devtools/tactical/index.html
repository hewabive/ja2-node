<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tactical · ja2-node</title>
    <link rel="stylesheet" href="../map-viewer/style.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <a href="/" class="brand">ja2-node</a>
      <span class="title">tactical sandbox</span>
      <span class="group">time
        <button type="button" data-speed="0">pause</button><button type="button" data-speed="1">1×</button><button type="button" data-speed="2">2×</button><button type="button" data-speed="4">4×</button><button type="button" data-speed="8">8×</button><button type="button" data-speed="instant">instant</button>
      </span>
      <span class="group">playback <button type="button" data-playback="1">1×</button><button type="button" data-playback="4">4×</button><button type="button" data-playback="16">16×</button><button type="button" id="skip">skip</button></span>
      <button type="button" id="idle">run until idle</button>
      <button type="button" id="endTurn">end turn</button>
      <button type="button" id="trade" disabled>trade</button>
      <button type="button" id="talkButton" disabled>talk</button>
      <label><input id="roofs" type="checkbox" checked /> roofs</label>
      <span class="group">zoom <button type="button" data-zoom="1">1×</button><button type="button" data-zoom="2">2×</button></span>
      <span id="status" class="status">connecting…</span>
    </header>
    <main>
      <canvas id="canvas"></canvas>
      <div id="info" class="info"></div>
      <canvas id="radar" class="radar" width="88" height="44" hidden></canvas>
      <aside id="door" class="door" hidden>
        <h2 id="doorTitle">Door</h2>
        <div id="doorState"></div>
        <div id="doorOptions" class="actions"></div>
        <div class="actions"><button type="button" id="closeDoorPanel">close</button></div>
        <div id="doorResult" class="shop-result"></div>
      </aside>
      <aside id="prompt" class="door prompt" hidden>
        <h2 id="promptTitle">Prompt</h2>
        <div id="promptChoices" class="actions"></div>
        <div id="promptResult" class="shop-result"></div>
      </aside>
      <aside id="talk" class="talk" hidden>
        <h2 id="talkTitle">Talk</h2>
        <div id="talkLines" class="talk-lines"></div>
        <div id="talkRequest" class="talk-request" hidden></div>
        <div id="talkMenu" class="actions"></div>
        <div id="talkGive" class="talk-give" hidden></div>
        <div class="actions"><button type="button" id="closeTalk">done</button></div>
        <div id="talkResult" class="shop-result"></div>
      </aside>
      <aside id="shop" class="shop" hidden>
        <h2 id="shopTitle">Shop</h2>
        <table id="shopBoxes"></table>
        <h3>Your items</h3>
        <table id="shopInventory"></table>
        <div class="actions"><button type="button" id="closeShop">close shop</button></div>
        <div id="shopResult" class="shop-result"></div>
      </aside>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
