name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint, types, layer imports, unit tests
        run: pnpm check
      - name: Stub pack
        run: pnpm stubs
      - name: Benchmarks (smoke run on stubs, docs/27 §7.6)
        run: |
          pnpm cli bench all --runs 1 --data '' --out bench.jsonl
          pnpm cli bench autoresolve --variant side-10 --runs 1 --calls --data '' --out bench.jsonl
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench
          path: bench.jsonl
          if-no-files-found: ignore
      - name: Client build
        run: pnpm build
      - name: E2E (Playwright, stubs only)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
