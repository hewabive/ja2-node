name: CI

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint, types, layer imports, unit tests
        run: pnpm check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stub pack
        run: pnpm stubs
      - name: Benchmarks (smoke run on stubs)
        run: |
          pnpm cli bench all --runs 1 --data '' --out bench.jsonl
          pnpm cli bench autoresolve --variant side-10 --runs 1 --calls --data '' --out bench.jsonl
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench
          path: bench.jsonl
          if-no-files-found: ignore
      - name: Client build
        run: pnpm build

  e2e:
    name: e2e (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: E2E (Playwright, stubs only, one shard of three; the runner image has Chrome's system libraries, the dev server builds the stub pack)
        run: |
          pnpm exec playwright install chromium
          pnpm e2e --shard=${{ matrix.shard }}/3
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore

  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Does the change reach the canvas presentation (pnpm gates)?
        id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          run=true
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            plan=$(node tools/gates.ts --since "$BASE" --plan)
            echo "gates since $BASE: $(echo $plan)"
            grep -qx 'e2e:browsers' <<< "$plan" || run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: Pixel-exact presentation in Chromium and Firefox (Firefox needs a display for WebGL without a GPU; the runner image has the system libraries)
        if: steps.plan.outputs.run == 'true'
        run: |
          pnpm exec playwright install chromium firefox
          xvfb-run -a pnpm e2e:browsers
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-browsers-results
          path: test-results/
          if-no-files-found: ignore
